<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset Password | Veritas-Net</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
</head>

<body class="auth-body">
    <div class="auth-card text-center" style="max-width: 550px;">
        <a href="index.html"
            class="h2 fw-bold tracking-tighter text-white font-headline mb-4 text-decoration-none d-block">Veritas-Net</a>

        <h1 class="h3 fw-bold text-white font-headline mb-2">Reset Password</h1>
        <p class="text-white opacity-50 small mb-4" id="instructionText">Enter your email to retrieve your security
            question.</p>

        <div id="authMessage" class="auth-message"></div>

        <form id="step1Form">
            <div class="mb-4 text-start">
                <label class="text-white fw-bold small text-uppercase tracking-widest mb-2 d-block">Account
                    Email</label>
                <input type="email" id="resetEmail" class="form-control" placeholder="shahroz@example.com" required>
            </div>
            <button type="submit" id="step1Btn" class="btn-mint w-100 py-3 fs-5 mb-4">
                Find My Account
            </button>
        </form>

        <form id="step2Form" style="display: none;">
            <div class="mb-4 text-start p-3 rounded"
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                <label class="text-mint fw-bold small text-uppercase tracking-widest mb-1 d-block">Your Security
                    Question:</label>
                <div id="displayQuestion" class="text-white fw-bold fs-5">Loading question...</div>
            </div>

            <div class="mb-4 text-start">
                <label class="text-white fw-bold small text-uppercase tracking-widest mb-2 d-block">Your Answer</label>
                <input type="text" id="resetAnswer" class="form-control" placeholder="Enter your answer" required>
            </div>

            <div class="row g-4 mb-4 text-start">
                <div class="col-md-6">
                    <label class="text-white fw-bold small text-uppercase tracking-widest mb-2 d-block">New
                        Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="col-md-6">
                    <label class="text-white fw-bold small text-uppercase tracking-widest mb-2 d-block">Confirm</label>
                    <input type="password" id="confirmNewPassword" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" id="step2Btn" class="btn-mint w-100 py-3 fs-5 mb-4">
                Securely Reset Password
            </button>
        </form>

        <p class="text-white opacity-50 small mb-0 mt-4">
            Remembered your password? <a href="login.html" class="text-mint fw-bold text-decoration-none">Sign In
                here</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const step1Form = document.getElementById('step1Form');
            const step2Form = document.getElementById('step2Form');
            const authMessage = document.getElementById('authMessage');
            let userEmail = ''; // Store the email between steps

            function showMsg(text, type) {
                authMessage.className = `auth-message ${type}`;
                authMessage.textContent = text;
            }

            // --- STEP 1: Fetch the question ---
            step1Form.addEventListener('submit', async function (e) {
                e.preventDefault();
                userEmail = document.getElementById('resetEmail').value.trim();
                const btn = document.getElementById('step1Btn');

                btn.disabled = true;
                btn.textContent = 'Searching...';

                try {
                    const response = await fetch('/api/auth/get-security-question', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: userEmail })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        // Hide Step 1, Show Step 2
                        step1Form.style.display = 'none';
                        document.getElementById('instructionText').textContent = "Answer your security question to set a new password.";
                        document.getElementById('displayQuestion').textContent = data.security_question;
                        step2Form.style.display = 'block';
                        authMessage.className = 'auth-message'; // clear errors
                    } else {
                        showMsg(data.error || 'Account not found.', 'error');
                    }
                } catch (err) {
                    showMsg('Connection error. Is the server running?', 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Find My Account';
                }
            });

            // --- STEP 2: Verify answer and reset password ---
            step2Form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const answer = document.getElementById('resetAnswer').value.trim();
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmNewPassword').value;
                const btn = document.getElementById('step2Btn');

                if (newPassword !== confirmPassword) {
                    showMsg('New passwords do not match.', 'error');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'Verifying...';

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: userEmail,
                            security_answer: answer,
                            new_password: newPassword
                        })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        showMsg('Password reset successfully! Redirecting to login...', 'success');
                        setTimeout(() => window.location.href = 'login.html', 2000);
                    } else {
                        showMsg(data.error || 'Failed to reset password.', 'error');
                    }
                } catch (err) {
                    showMsg('Connection error. Is the server running?', 'error');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Securely Reset Password';
                }
            });
        });
    </script>
</body>

</html>
